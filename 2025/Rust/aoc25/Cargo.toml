[package]
name = "aoc25"
version = "0.1.0"
edition = "2024"

[features]
benchmark = ["dep:num-format"]

[dependencies]
# Core
aoc25-macros = { version = "0.1.0", path = "../aoc25-macros" }
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
comfy-table = "7.2.1"
num-format = { version = "0.4.4", optional = true }
paste = "1.0.15"  # Unmaintained

# Tools
itertools = "0.14.0"

# Performances
hashbrown = "0.16.1"
rayon = "1.11.0"

# Solutions
nom = "8.0.0"
regex = "1.12.2"
